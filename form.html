<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventarizz - Tambah Barang</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>

    <header class="navbar">
        <div class="logo">
            <h1>Inventarizz</h1>
        </div>

        <nav>
            <ul>
                <li><a href="index.html">Daftar Inventaris</a></li>
                <li><a href="form.html">Tambah Barang</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="mx-auto my-10 max-w-2xl rounded-xl bg-white p-6 shadow-md sm:p-8">
            <h2 class="mb-2 text-2xl font-bold text-gray-800">Form Tambah Barang</h2>
            <p class="mb-6 text-gray-600">Tambah Data Inventaris</p>
            <form action="#" method="post" class="space-y-4">
                <p>
                    <label for="nama" class="mb-1 block font-medium text-gray-700">Nama Barang:</label>
                    <input type="text" id="nama" name="nama" required class="w-full rounded-md border border-gray-300 px-3 py-2 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200">
                </p>
                <p>
                    <label for="gambar" class="mb-1 block font-medium text-gray-700">Gambar Barang:</label>
                    <input type="file" id="gambar" name="gambar" accept="image/*" class="w-full rounded-md border border-gray-300 px-3 py-2 text-gray-700 file:mr-4 file:rounded file:border-0 file:bg-blue-50 file:px-3 file:py-2 file:text-blue-700">
                </p>
                <p>
                    <label for="kategori" class="mb-1 block font-medium text-gray-700">Kategori:</label>
                    <select id="kategori" name="kategori" class="w-full rounded-md border border-gray-300 bg-white px-3 py-2 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200">
                        <option value="">-- Pilih Kategori --</option>
                        <option value="elektronik">Elektronik</option>
                        <option value="furniture">Furniture</option>
                        <option value="alat">Alat</option>
                        <option value="lainnya">Lainnya</option>
                    </select>
                </p>
                <p>
                    <label for="jumlah" class="mb-1 block font-medium text-gray-700">Jumlah:</label>
                    <input type="number" id="jumlah" name="jumlah" min="1" required class="w-full rounded-md border border-gray-300 px-3 py-2 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200">
                </p>
                <p>
                    <label for="kondisi" class="mb-1 block font-medium text-gray-700">Kondisi:</label>
                    <select id="kondisi" name="kondisi" class="w-full rounded-md border border-gray-300 bg-white px-3 py-2 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200">
                        <option value="">-- Pilih Kondisi --</option>
                        <option value="baik">Baik</option>
                        <option value="rusak_ringan">Rusak Ringan</option>
                        <option value="rusak_berat">Rusak Berat</option>
                    </select>
                </p>
                <p>
                    <label for="deskripsi" class="mb-1 block font-medium text-gray-700">Deskripsi Barang:</label>
                    <textarea id="deskripsi" name="deskripsi" rows="5" cols="40" class="w-full rounded-md border border-gray-300 px-3 py-2 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200"></textarea>
                </p>
                <p class="gap-3 pt-2">
                    <button type="submit" class="rounded-md bg-blue-600 px-5 py-2 font-medium text-white transition hover:bg-blue-700">Simpan Barang</button>
                    <button type="reset" class="rounded-md border border-gray-300 px-5 py-2 font-medium text-gray-700 transition hover:bg-gray-100">Reset</button>
                </p>
            </form>
        </section>
    </main>

    <footer>
        <p>Bagian Footer</p>
    </footer>

</body>

</html>
